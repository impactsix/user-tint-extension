name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm install --no-fund --no-audit
          node -e "require('typescript'); require('@types/vscode'); require('@types/node')"

      - run: npm run compile

      - run: npm test

      - run: npm run verify-changelog
